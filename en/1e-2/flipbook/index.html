<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cecile Flipbook</title>
  <script src="jquery-3.6.0.min.js"></script>
  <script src="turn.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ccc;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #book-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #flipbook {
      aspect-ratio: 2.83 / 1;  /* A4 landscape spread (2x210 / 297) */
      width: 95vw;
      max-height: 95vh;
      position: relative;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
    }

    #flipbook .page {
      aspect-ratio: 1.414 / 1; /* A4 landscape single page (297 / 210) */
      width: 100%;
      height: auto;
      background-color: white;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center center;
      overflow: hidden;
      box-shadow: inset 10px 0 15px -10px rgba(0, 0, 0, 0.25),
                  inset -10px 0 15px -10px rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body>
  <div id="book-container">
    <div id="flipbook"></div>
  </div>

  <script>
    const totalPages = 48;
    const flipbook = document.getElementById("flipbook");

    for (let i = 1; i <= totalPages; i++) {
      const pageNum = String(i).padStart(3, '0');
      const div = document.createElement("div");
      div.className = "page";
      div.style.backgroundImage = `url('png/page_${pageNum}.png')`;
      flipbook.appendChild(div);
    }

    $(document).ready(function () {
      $("#flipbook").turn({
        width: $("#flipbook").width(),
        height: $("#flipbook").height(),
        autoCenter: true,
        display: 'double',
        acceleration: true
      });

      // Recompute width/height on resize
      $(window).on('resize', function () {
        const $flipbook = $("#flipbook");
        $flipbook.turn("size", $flipbook.width(), $flipbook.height());
      });
    });
  </script>
</body>
</html>
